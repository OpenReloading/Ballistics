name: Bug report
description: Something does not work as described.
labels: [bug, needs-triage]
body:
  - type: textarea
    id: plain
    attributes:
      label: In plain words
      description: What is wrong, said so that someone who does not know the code understands it.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, step by step, with the smallest input or data that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened instead, with the full error message or log.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit or the date of the version you used.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and operating system, and for the API the client you used.
