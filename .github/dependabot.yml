# Weekly version updates, minor and patch grouped per ecosystem; security updates come at once
# (repository settings), except that pnpm installs no release younger than three days: a fix that new needs an
# entry in minimumReleaseAgeExclude of pnpm-workspace.yaml. Three days of cooldown let a broken or malicious release be pulled first
# (.github/zizmor.yml tells zizmor, whose audit expects seven). The npm ecosystem reads pnpm-lock.yaml
# and the catalog of pnpm-workspace.yaml; .github/pnpm pins the pnpm of the workflows and images
# (.devcontainer/Dockerfile installs the same version, bumped by hand). A @mantine/* update also copies
# .claude/skills/mantine-form anew from github.com/mantinedev/skills (now at 607846dbc328b6ddc85106d8aad3c080f9f57a1d).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /.github/pnpm
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/packages/api, /apps/docs, /.devcontainer]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      # Node major follows .nvmrc and engines, changed by hand
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: "*typescript-node"
        update-types: [version-update:semver-major]
