name: CI

on:
  # Release tags and images: release.yml.
  push:
    branches: [main]
  pull_request:
  # Ready for a merge queue on `main`; without one the push run checks every merge.
  merge_group:
  # Every push to `main` runs everything. The weekly run, before the weekly release (release-weekly.yml), adds a full
  # run in a week without merges and the checks whose result changes without a commit, such as the advisories that
  # tools/src/audit.ts reads.
  schedule:
    - cron: "0 4 * * 1" # Monday 04:00
      timezone: Europe/Berlin

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Tool images of the `docker run` steps below and the typos release (the action is not on the repository's list of
# allowed actions). Dependabot does not read them: bump them by hand, oasdiff and Schemathesis together with
# .devcontainer/Dockerfile, lychee together with links.yml, the typos checksum with its version, Playwright together
# with @playwright/test in pnpm-workspace.yaml (the e2e job fails on a mismatch).
env:
  TYPOS_VERSION: 1.51.1
  TYPOS_SHA256: 93c301fd4120ff076e2cc2a6d6a61cab4a4bdb81899287c0938b452e56d1f454
  ACTIONLINT_IMAGE: docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  OASDIFF_IMAGE: docker.io/tufin/oasdiff:v1.33.0@sha256:6263a96dd2ef0726c54e21fea9b8e1607eac4841add0079324b424c1f52b819c
  LYCHEE_IMAGE: docker.io/lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d
  SCHEMATHESIS_IMAGE: docker.io/schemathesis/schemathesis:v4.29.4@sha256:16d21ecba0097fc8a3ca71b8d1db3797d2a057610d808715871216450e63f0a6
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f

# The jobs stay in this file until the shared gates workflow of ESchuderer/reusable-workflows is released; then they
# become a call pinned by commit SHA, and `check` stays here (it names this file's jobs).
jobs:
  # Which jobs run and what the e2e job exports: only a pull request may skip `check` (prose only) or `e2e` (no
  # change to what the API, the web app, the export scripts or the e2e specs read), test only the workspaces it
  # reaches (pnpm's `--filter "...[<base>]"`, which adds every workspace that depends on a changed one), or export a
  # sample of the cartridge pages. Every other event (the default branch, the merge queue, the weekly run) and every
  # doubt runs everything; see apps/web/scripts/ci-plan.mts.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      check: ${{ steps.plan.outputs.check }}
      e2e: ${{ steps.plan.outputs.e2e }}
      prerender: ${{ steps.plan.outputs.prerender }}
      tests: ${{ steps.plan.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the base commit of a pull request must be present for the file list
          fetch-depth: 0
          persist-credentials: false
      # pnpm selects the workspaces from the manifests and git; it needs no install
      - uses: ./.github/actions/pnpm
        with:
          install: "false"
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON apps/web/scripts/ci-plan.mts >> "$GITHUB_OUTPUT"

  # The checks of the whole repository; the plan skips them for prose only.
  static:
    needs: changes
    # a failed `changes` job leaves the outputs empty, so the job runs
    if: ${{ !cancelled() && needs.changes.outputs.check != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      # build first: the typed lint of the packages reads the declarations of the workspaces they import
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run knip
      - run: pnpm run docs:check
      - run: pnpm run data:validate
      # `pnpm run api:check` in the dev container; the same oasdiff version as .devcontainer/Dockerfile
      - run: node tools/src/openapi.ts
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Breaking changes of the API document (oasdiff)
        run: docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP:/doc:ro" -w /repo "$OASDIFF_IMAGE" breaking packages/api/openapi.baseline.json /doc/openapi.json --fail-on ERR
      - run: node tools/src/audit.ts
      # licences of the production dependencies of the images and the generated list in NOTICE
      - run: node tools/src/licences.ts

  # One job per group of workspaces (the drawing and web suites being the slow ones), each testing the workspaces of
  # its group that the plan selects; together all groups are what the root `pnpm test` runs. The workspaces import
  # each other's dist/, so each job builds. A failed `changes` job leaves the outputs empty, so every group runs
  # (the fallback is testJobs() of the plan, which apps/web/test/ci-plan.test.ts compares).
  test:
    name: test (${{ matrix.name }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.check != 'false' && needs.changes.outputs.tests != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.tests || '[{"name":"drawing","filter":"--filter @open-reloading/drawing","e2eUnit":false},{"name":"web","filter":"--filter @open-reloading/web","e2eUnit":false},{"name":"packages","filter":"--filter @open-reloading/units --filter @open-reloading/locale-format --filter @open-reloading/design-tokens --filter @open-reloading/statistics --filter @open-reloading/ballistics --filter @open-reloading/shot-groups --filter @open-reloading/schema --filter @open-reloading/importers --filter @open-reloading/catalog --filter @open-reloading/api --filter @open-reloading/cli --filter @open-reloading/docs --filter @open-reloading/tools --filter @open-reloading/test-kit","e2eUnit":true},{"name":"ui","filter":"--filter @open-reloading/ui","e2eUnit":false}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      - run: pnpm run build
      - if: matrix.filter != ''
        run: |
          # unquoted on purpose: the value is several `--filter name` words
          # shellcheck disable=SC2086
          pnpm --workspace-concurrency=1 $WORKSPACES run test
        env:
          WORKSPACES: ${{ matrix.filter }}
      # The stories of packages/ui as browser tests (axe included) and the Storybook build, in the Playwright image of
      # the e2e job, whose browsers are those of the locked playwright
      - if: matrix.name == 'ui'
        name: Story tests and the Storybook build in the Playwright image
        run: |
          version=$(node -p "require('./packages/ui/node_modules/playwright/package.json').version")
          case $PLAYWRIGHT_IMAGE in
            "mcr.microsoft.com/playwright:v$version-noble@sha256:"*) docker pull --quiet "$PLAYWRIGHT_IMAGE" ;;
            *) echo "::error::PLAYWRIGHT_IMAGE (ci.yml) is not v$version-noble, the locked playwright"; exit 1 ;;
          esac
          image=$(docker run --rm "$PLAYWRIGHT_IMAGE" cat /ms-playwright/.docker-info | jq -r .driverVersion)
          [ "$image" = "$version" ] || { echo "::error::the digest of PLAYWRIGHT_IMAGE (ci.yml) is Playwright $image, not $version"; exit 1; }
          docker run --rm --init --ipc=host --user "$(id -u):$(id -g)" --env HOME=/tmp --env CI \
            --volume "$PWD:$PWD" --workdir "$PWD/packages/ui" "$PLAYWRIGHT_IMAGE" npm run test:browser
      - if: matrix.e2eUnit
        run: pnpm --filter @open-reloading/e2e run test:unit

  # The one check the ruleset requires: it waits for every other job of this workflow and fails when one failed or
  # was cancelled, or was skipped where the plan cannot skip it (only `static`, `test` and `e2e` may be). It also
  # checks the relative links and anchors of the Markdown files and the spelling of the tracked text files (typos,
  # which skips `_typos.toml` itself) on every run: the plan skips `static` for prose that no other check reads,
  # which is where a link or a word breaks. External links: links.yml.
  check:
    needs: [changes, static, test, e2e, workflows, dependency-review]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Relative links and anchors of the Markdown files (lychee, offline)
        run: git ls-files '*.md' '*.mdx' | docker run --rm --interactive -v "$PWD:/repo:ro" -w /repo "$LYCHEE_IMAGE" --config lychee.toml --offline --files-from -
      - name: Spelling of code, comments, docs and UI text (typos)
        run: |
          curl --proto "=https" --tlsv1.2 --fail --silent --show-error --location --output "$RUNNER_TEMP/typos.tar.gz" "https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "$TYPOS_SHA256  $RUNNER_TEMP/typos.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/typos.tar.gz" --directory "$RUNNER_TEMP" ./typos
          "$RUNNER_TEMP/typos"
      - name: Results of the other jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'to_entries | all(.value.result == "success" or (.value.result == "skipped" and (.key | IN("static", "test", "e2e"))))' <<< "$NEEDS" > /dev/null

  # Workflow lint and security audit of .github/workflows and dependabot.yml.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          advanced-security: false

  # It compares a pull request's dependencies with its base, so only a pull request runs the step; the job still
  # reports on `merge_group`, where the queue needs its required status.
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # the action reads a local config-file from disk
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown

  # The API runs from its compose service, as shipped: Schemathesis checks it against its document and the load
  # file spec posts to it. The tests, the drawing baseline, the JavaScript budget and the prerender check run on the
  # static export (`pnpm --filter @open-reloading/tools run pages`, served at the site root by `pages-serve`), which holds
  # no API: the smoke spec compares its data files and its workbench with the API's answers.
  e2e:
    needs: changes
    # a failed `changes` job still runs e2e, with empty outputs: every record page is exported
    if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
    runs-on: ubuntu-latest
    # at least 10 minutes above the slowest run of main (32 minutes)
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      API_URL: http://localhost:3000
      WEB_URL: http://localhost:3003
      # only a pull request whose plan says so exports the sample of the cartridge pages
      PRERENDER: ${{ github.event_name == 'pull_request' && needs.changes.outputs.prerender == 'sample' && 'sample' || 'full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the drawing contact sheet compares with the base commit
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      # The tests run in the Playwright image, which holds the browsers and the fonts they render with: nothing is
      # installed from apt or the browser CDN on the runner. Its browsers are those of the lockfile's @playwright/test.
      - name: Pull the Playwright image of the locked @playwright/test
        run: |
          version=$(node -p "require('./apps/e2e/node_modules/@playwright/test/package.json').version")
          case $PLAYWRIGHT_IMAGE in
            "mcr.microsoft.com/playwright:v$version-noble@sha256:"*) docker pull --quiet "$PLAYWRIGHT_IMAGE" ;;
            *) echo "::error::PLAYWRIGHT_IMAGE (ci.yml) is not v$version-noble, the locked @playwright/test"; exit 1 ;;
          esac
          # the digest decides what is pulled, not the tag: the version the image records must match as well
          image=$(docker run --rm "$PLAYWRIGHT_IMAGE" cat /ms-playwright/.docker-info | jq -r .driverVersion)
          [ "$image" = "$version" ] || { echo "::error::the digest of PLAYWRIGHT_IMAGE (ci.yml) is Playwright $image, not $version"; exit 1; }
      # the export build and the specs import the workspace packages from their dist/
      # units and statistics first: schema, ballistics and shot-groups build them through their project references
      - run: pnpm --filter @open-reloading/units --filter @open-reloading/locale-format --filter @open-reloading/statistics --filter @open-reloading/ballistics --filter @open-reloading/shot-groups --filter @open-reloading/schema --filter @open-reloading/importers --filter @open-reloading/drawing --filter @open-reloading/catalog --filter @open-reloading/api run build
      - run: docker compose up --detach --build api
      - name: Wait for the API
        run: |
          for _ in $(seq 1 60); do
            curl --silent --fail http://localhost:3000/ && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      # `pnpm run api:conformance` in the dev container; the same Schemathesis version and checks
      - name: API conformance to its document (Schemathesis)
        run: |
          TMPDIR="$RUNNER_TEMP" node tools/src/openapi.ts
          docker run --rm --network=host -v "$RUNNER_TEMP:/doc:ro" "$SCHEMATHESIS_IMAGE" \
            run /doc/openapi.json --url http://localhost:3000 --checks not_a_server_error,status_code_conformance,content_type_conformance,response_schema_conformance
      # The Turbopack compile cache only (.next/cache/fetch-cache holds API responses, so it never leaves the run).
      # A pull request restores the newest cache of its own branch or of the default branch (GitHub scopes caches
      # that way, so a fork's cache cannot reach another branch). A merge queue run builds from nothing and saves
      # nothing: its cache is scoped to the queue branch, which no pull request reads.
      - name: Key of the Turbopack cache
        id: next
        run: |
          next=$(node -p "require('./apps/web/package.json').dependencies.next")
          echo "prefix=next-export-$RUNNER_OS-$RUNNER_ARCH-$next" >> "$GITHUB_OUTPUT"
      - name: Restore the Turbopack cache
        id: cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache/turbopack
          key: ${{ steps.next.outputs.prefix }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'apps/web/next.config.ts') }}-${{ hashFiles('apps/web/src/**', 'packages/*/src/**') }}
          restore-keys: |
            ${{ steps.next.outputs.prefix }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'apps/web/next.config.ts') }}-
      # the export leaves .next to the cache and to the JavaScript budget; the docs site is no part of this job
      - name: Export the static site
        run: |
          if [ "$PRERENDER" = sample ]; then
            pnpm --filter @open-reloading/tools run pages --sample
          else
            pnpm --filter @open-reloading/tools run pages --no-docs
          fi
      - name: Save the Turbopack cache
        if: github.event_name == 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache/turbopack
          key: ${{ steps.next.outputs.prefix }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'apps/web/next.config.ts') }}-${{ hashFiles('apps/web/src/**', 'packages/*/src/**') }}
      - name: JavaScript budget per route
        run: pnpm --filter @open-reloading/web run check-weight
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON apps/web/scripts/check-prerender.mts
      - name: Serve the export
        run: |
          node tools/src/pages-serve.ts &
          for _ in $(seq 1 30); do curl --silent --fail http://localhost:3003/ > /dev/null && exit 0; sleep 1; done
          exit 1
      # `pnpm run test:e2e` as scripts/baseline.sh runs it: as the runner's user, so the results stay writable for the
      # later steps
      - name: End-to-end tests in the Playwright image
        run: |
          docker run --rm --init --ipc=host --network=host --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --env CI --env GITHUB_ACTIONS --env API_URL --env WEB_URL --volume "$PWD:$PWD" --workdir "$PWD/apps/e2e" \
            "$PLAYWRIGHT_IMAGE" npx playwright test
      - name: Drawing baseline in the Playwright image
        run: pnpm --filter @open-reloading/e2e run drawing-baseline
      - name: Paired contact sheet of the baseline drawings when drawing code changed
        id: sheet
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git cat-file -e "$BASE^{commit}" 2>/dev/null || { echo "no base commit"; exit 0; }
          if git diff --quiet "$BASE" HEAD -- packages/drawing/src 'apps/web/src/components/*drawing*'; then
            echo "no drawing change"; exit 0
          fi
          snaps='apps/e2e/tests/web/drawing-baseline.spec.ts-snapshots/'
          # the committed baseline images of a revision as <stem>__none__<theme>__<width>.png
          put() {
            mkdir -p "sheet/$1/drawings"
            git ls-tree --name-only "$2" $snaps | grep '\.png$' | while read -r f; do
              n=$(basename "$f" -linux.png); w=390
              case $n in *-1280) w=1280; n=${n%-1280} ;; esac
              git show "$2:$f" > "sheet/$1/drawings/${n%-*}__none__${n##*-}__$w.png"
            done
          }
          put before "$BASE"
          put after HEAD
          pnpm --filter @open-reloading/e2e run pair-sheets "$PWD/sheet/before" "$PWD/sheet/after" "$PWD/sheet/out"
          echo "made=1" >> "$GITHUB_OUTPUT"
      - name: Keep the paired contact sheet for review
        if: steps.sheet.outputs.made == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drawing-contact-sheet
          path: sheet/out
      - name: Keep the e2e results (actual and diff images) of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: apps/e2e/test-results
      - if: always()
        run: docker compose down --volumes
