name: CI

on:
  # Release tags and images: release.yml.
  push:
    branches: [main]
  pull_request:
  # Ready for a merge queue on `main`; without one the push run checks every merge.
  merge_group:
  # Every push to `main` runs everything. The weekly run, before the weekly release (release-weekly.yml), adds a full
  # run in a week without merges and the checks whose result changes without a commit, such as the advisories that
  # tools/src/audit.ts reads.
  schedule:
    - cron: "0 4 * * 1" # Monday 04:00
      timezone: Europe/Berlin

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Tool images of the `docker run` steps below, the typos release (the action is not on the repository's list of
# allowed actions) and the uv version of the `hole-model` job. Dependabot does not read them: bump them by hand,
# oasdiff and Schemathesis together with .devcontainer/Dockerfile, the typos checksum with its version, Playwright
# together with @playwright/test in pnpm-workspace.yaml (every job that pulls the image fails on a mismatch).
env:
  TYPOS_VERSION: 1.51.1
  TYPOS_SHA256: 93c301fd4120ff076e2cc2a6d6a61cab4a4bdb81899287c0938b452e56d1f454
  ACTIONLINT_IMAGE: docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  OASDIFF_IMAGE: docker.io/tufin/oasdiff:v1.33.0@sha256:6263a96dd2ef0726c54e21fea9b8e1607eac4841add0079324b424c1f52b819c
  SCHEMATHESIS_IMAGE: docker.io/schemathesis/schemathesis:v4.29.4@sha256:16d21ecba0097fc8a3ca71b8d1db3797d2a057610d808715871216450e63f0a6
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579

# The jobs stay in this file until a shared gates workflow is released; then they
# become a call pinned by commit SHA, and `check` stays here (it names this file's jobs).
jobs:
  # Which jobs run and what the e2e jobs export: only a pull request may skip `check` (prose only), `e2e` and `e2e-next` (no
  # change to what the API, the web app, the export scripts or the e2e specs read) or `docs` (no change to the docs
  # site or to what the plan lists as read by its image build), test only the workspaces it reaches (pnpm's
  # `--filter "...[<base>]"`, which adds every workspace that depends on a changed one), or export a sample of the
  # cartridge pages. Every other event (the default branch, the merge queue, the weekly run) and every doubt runs
  # everything; see apps/web/scripts/ci-plan.mts.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      check: ${{ steps.plan.outputs.check }}
      e2e: ${{ steps.plan.outputs.e2e }}
      docs: ${{ steps.plan.outputs.docs }}
      prerender: ${{ steps.plan.outputs.prerender }}
      tests: ${{ steps.plan.outputs.tests }}
      hole-model: ${{ steps.hole-model.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the base commit of a pull request must be present for the file list
          fetch-depth: 0
          persist-credentials: false
      # pnpm selects the workspaces from the manifests and git; it needs no install
      - uses: ./.github/actions/pnpm
        with:
          install: "false"
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON apps/web/scripts/ci-plan.mts >> "$GITHUB_OUTPUT"
      # the Python training project, outside the pnpm workspaces: a pull request that changes neither it nor this file
      # skips it; a git error runs it
      - id: hole-model
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          run=true
          if [ "$EVENT_NAME" = pull_request ]; then
            changed=$(git diff --name-only "$BASE_SHA" HEAD -- training/hole-model .github/workflows/ci.yml) || changed=doubt
            [ -n "$changed" ] || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # The checks of the whole repository; the plan skips them for prose only.
  static:
    needs: changes
    # a failed `changes` job leaves the outputs empty, so the job runs
    if: ${{ !cancelled() && needs.changes.outputs.check != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      # build first: the typed lint of the packages reads the declarations of the workspaces they import
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run lint
      # the list of texts without German only shrinks: the catalogue lint fails for a listed text the base does not list
      - if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          pnpm --filter @rangefoundry/web run i18n check de "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # a pull request adds no multi-line comment and keeps the references of the comments it only rewords; the i18n step above fetched the base
      - if: github.event_name == 'pull_request'
        run: node tools/src/comment-lines.ts "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - run: pnpm run knip
      - run: pnpm run docs:check
      - run: pnpm run data:validate
      # `pnpm run api:check` in the dev container; the same oasdiff version as .devcontainer/Dockerfile
      - run: node tools/src/openapi.ts
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Breaking changes of the API document (oasdiff)
        run: docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP:/doc:ro" -w /repo "$OASDIFF_IMAGE" breaking packages/api/openapi.baseline.json /doc/openapi.json --fail-on ERR
      - run: node tools/src/audit.ts
      # licenses of the production dependencies of the images and the generated list in NOTICE
      - run: node tools/src/licences.ts

  # One job per group of workspaces, each testing the workspaces of its group that the plan selects; together all
  # groups are what the root `pnpm test` runs. The workspaces import each other's dist/, so each job builds. A failed
  # `changes` job leaves the outputs empty, so every group runs (the fallback is testJobs() of the plan, which
  # apps/web/test/ci-plan.test.ts compares).
  test:
    name: test (${{ matrix.name }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.check != 'false' && needs.changes.outputs.tests != '[]' }}
    runs-on: ubuntu-latest
    # two and a half times the run of the slowest group (packages, 9 to 10 minutes)
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.tests || '[{"name":"drawing","filter":"--filter @rangefoundry/svg-drawings","e2eUnit":false},{"name":"web","filter":"--filter @rangefoundry/web","e2eUnit":false},{"name":"packages","filter":"--filter @rangefoundry/units --filter @rangefoundry/locale-format --filter @rangefoundry/design-tokens --filter @rangefoundry/statistics --filter @rangefoundry/ballistics --filter @rangefoundry/shot-groups --filter @rangefoundry/schema --filter @rangefoundry/importers --filter @rangefoundry/catalog --filter @rangefoundry/target-recognition --filter @rangefoundry/use-cases --filter @rangefoundry/api --filter @rangefoundry/docs --filter @rangefoundry/tools --filter @rangefoundry/test-kit","e2eUnit":true},{"name":"cli","filter":"--filter @rangefoundry/cli","e2eUnit":false},{"name":"ui","filter":"--filter @rangefoundry/ui","e2eUnit":false}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      - run: pnpm run build
      - if: matrix.filter != ''
        run: |
          # unquoted on purpose: the value is several `--filter name` words
          # shellcheck disable=SC2086
          pnpm --workspace-concurrency=1 $WORKSPACES run test
        env:
          WORKSPACES: ${{ matrix.filter }}
      # The stories of packages/ui as browser tests (axe included) and the Storybook build, in the Playwright image of
      # the e2e and e2e-next jobs, whose browsers are those of the locked playwright
      - if: matrix.name == 'ui'
        uses: ./.github/actions/playwright-image
        with:
          package: packages/ui/node_modules/playwright/package.json
      - if: matrix.name == 'ui'
        name: Story tests and the Storybook build in the Playwright image
        run: |
          docker run --rm --init --ipc=host --user "$(id -u):$(id -g)" --env HOME=/tmp --env CI \
            --volume "$PWD:$PWD" --workdir "$PWD/packages/ui" "$PLAYWRIGHT_IMAGE" npm run test:browser
      - if: matrix.e2eUnit
        run: pnpm --filter @rangefoundry/e2e run test:unit

  # The docs image as compose.yaml builds it. Its build runs the docs site build, which no other job of a pull
  # request runs: the e2e job exports the site without the docs, and pages.yml builds them on main.
  docs:
    needs: changes
    # a failed `changes` job leaves the outputs empty, so the job runs
    if: ${{ !cancelled() && needs.changes.outputs.docs != 'false' }}
    runs-on: ubuntu-latest
    # about three times its run on a runner (2 to 3 minutes)
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose build docs

  # The gates of training/hole-model; the lockfile pins the CPU build of torch on Linux.
  hole-model:
    needs: changes
    # a failed `changes` job leaves the outputs empty, so the job runs
    if: ${{ !cancelled() && needs.changes.outputs.hole-model != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: training/hole-model
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: 0.13.7
          enable-cache: false
      - run: uv sync --locked
      - run: uv run license-check
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  # The one check the ruleset requires: it waits for every other job of this workflow and fails when one failed or
  # was cancelled, or was skipped where the plan cannot skip it (only `static`, `test`, `docs` and `hole-model` may be, and the e2e jobs when the plan's `e2e` is false). It
  # also checks the spelling of the tracked text files (typos, which skips `_typos.toml` itself) on every run: the
  # plan skips `static` for prose that no other check reads, which is where a word breaks.
  check:
    needs:
      [
        changes,
        static,
        test,
        docs,
        e2e-checks,
        e2e-shard,
        e2e,
        e2e-next,
        hole-model,
        workflows,
        dependency-review,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node from .nvmrc runs the message list (i18n.mts imports no package)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Spelling of code, comments, docs and UI text (typos)
        run: |
          curl --proto "=https" --tlsv1.2 --fail --silent --show-error --location --output "$RUNNER_TEMP/typos.tar.gz" "https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "$TYPOS_SHA256  $RUNNER_TEMP/typos.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/typos.tar.gz" --directory "$RUNNER_TEMP" ./typos
          "$RUNNER_TEMP/typos"
          # the English messages apart, without the UK words of code names; a file, as a pipe hides a failed list
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON apps/web/scripts/i18n.mts messages > "$RUNNER_TEMP/messages.txt"
          "$RUNNER_TEMP/typos" - < "$RUNNER_TEMP/messages.txt"
      - name: Results of the other jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e '.changes.outputs.e2e as $e2e | to_entries | all(.value.result == "success" or (.value.result == "skipped" and ((.key | IN("static", "test", "docs", "hole-model")) or ($e2e == "false" and (.key | IN("e2e-checks", "e2e-shard", "e2e", "e2e-next"))))))' <<< "$NEEDS" > /dev/null

  # Workflow lint and security audit of .github/workflows and dependabot.yml.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          version: 1.31.1
          advanced-security: false

  # It compares a pull request's dependencies with its base, so only a pull request runs the step; the job still
  # reports on `merge_group`, where the queue needs its required status.
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # the action reads a local config-file from disk
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          config-file: ./.github/dependency-review-config.yml
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown

  # The API runs from its compose service, as shipped: Schemathesis checks it against its document and the load
  # file spec posts to it. The tests, the drawing baseline, the JavaScript budget and the prerender check run on the
  # static export (`pnpm --filter @rangefoundry/tools run pages`, served at the site root by `pages-serve`), which holds
  # no API: the smoke spec compares its data files and its workbench with the API's answers. `e2e-checks` runs the
  # steps that run once (Schemathesis, the budget, the prerender check, the drawing baseline), `e2e-shard` the
  # Playwright specs in three shards, each with its own API and export, and `e2e` is the required check of both.
  e2e-checks:
    needs: changes
    # a failed `changes` job still runs e2e, with empty outputs: every record page is exported
    if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      API_URL: http://localhost:3000
      WEB_URL: http://localhost:3003
      # only a pull request whose plan says so exports the sample of the cartridge pages
      PRERENDER: ${{ github.event_name == 'pull_request' && needs.changes.outputs.prerender == 'sample' && 'sample' || 'full' }}
      # as the Pages build sets it, so the specs see the shell's issue and repository links and the load switch's rule
      NEXT_PUBLIC_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the drawing contact sheet compares with the base commit
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      # The drawing baseline runs in the Playwright image, which holds the browsers and the fonts they render with:
      # nothing is installed from apt or the browser CDN on the runner. Its browsers are those of the lockfile's
      # @playwright/test.
      - name: Pull the Playwright image of the locked @playwright/test
        uses: ./.github/actions/playwright-image
        with:
          package: apps/e2e/node_modules/@playwright/test/package.json
      # the export build and the specs import the web app's workspace dependencies from their dist/; `web^...` selects
      # them from the package graph (pnpm builds them in dependency order), so a new dependency needs no edit here
      - run: pnpm --filter "@rangefoundry/web^..." run build
      - run: docker compose up --detach --build api
      - name: Wait for the API
        run: |
          for _ in $(seq 1 60); do
            curl --silent --fail http://localhost:3000/ && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      # `pnpm run api:conformance` in the dev container; the same Schemathesis version and checks
      - name: API conformance to its document (Schemathesis)
        run: |
          TMPDIR="$RUNNER_TEMP" node tools/src/openapi.ts
          docker run --rm --network=host -v "$RUNNER_TEMP:/doc:ro" "$SCHEMATHESIS_IMAGE" \
            run /doc/openapi.json --url http://localhost:3000 --checks not_a_server_error,status_code_conformance,content_type_conformance,response_schema_conformance
      # The Turbopack compile cache only (.next/cache/fetch-cache holds API responses, so it never leaves the run).
      # A pull request restores the newest cache of its own branch or of the default branch (GitHub scopes caches
      # that way, so a fork's cache cannot reach another branch). A merge queue run builds from nothing and saves
      # nothing: its cache is scoped to the queue branch, which no pull request reads. This job saves it, the shards
      # only restore it.
      - name: Key of the Turbopack cache
        id: next
        run: |
          next=$(node -p "require('./apps/web/package.json').dependencies.next")
          echo "prefix=next-export-$RUNNER_OS-$RUNNER_ARCH-$next" >> "$GITHUB_OUTPUT"
      - name: Restore the Turbopack cache
        id: cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache/turbopack
          key: ${{ steps.next.outputs.prefix }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'apps/web/next.config.ts') }}-${{ hashFiles('apps/web/src/**', 'packages/*/src/**') }}
          restore-keys: |
            ${{ steps.next.outputs.prefix }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'apps/web/next.config.ts') }}-
      # the export leaves .next to the cache and to the JavaScript budget; the docs site is no part of this job
      - name: Export the static site
        run: |
          if [ "$PRERENDER" = sample ]; then
            pnpm --filter @rangefoundry/tools run pages --sample
          else
            pnpm --filter @rangefoundry/tools run pages --no-docs
          fi
      - name: Save the Turbopack cache
        if: github.event_name == 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache/turbopack
          key: ${{ steps.next.outputs.prefix }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'apps/web/next.config.ts') }}-${{ hashFiles('apps/web/src/**', 'packages/*/src/**') }}
      - name: JavaScript budget per route
        run: pnpm --filter @rangefoundry/web run check-weight
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON apps/web/scripts/check-prerender.mts
      - name: Serve the export
        run: |
          node tools/src/pages-serve.ts &
          for _ in $(seq 1 30); do curl --silent --fail http://localhost:3003/ > /dev/null && exit 0; sleep 1; done
          exit 1
      - name: Drawing baseline in the Playwright image
        run: pnpm --filter @rangefoundry/e2e run drawing-baseline
      - name: Paired contact sheet of the baseline drawings when drawing code changed
        id: sheet
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git cat-file -e "$BASE^{commit}" 2>/dev/null || { echo "no base commit"; exit 0; }
          if git diff --quiet "$BASE" HEAD -- packages/svg-drawings/src 'apps/web/src/components/*drawing*'; then
            echo "no drawing change"; exit 0
          fi
          snaps='apps/e2e/tests/web/drawing-baseline.spec.ts-snapshots/'
          # the committed baseline images of a revision as <stem>__none__<theme>__<width>.png
          put() {
            mkdir -p "sheet/$1/drawings"
            git ls-tree --name-only "$2" $snaps | grep '\.png$' | while read -r f; do
              n=$(basename "$f" -linux.png); w=390
              case $n in *-1280) w=1280; n=${n%-1280} ;; esac
              git show "$2:$f" > "sheet/$1/drawings/${n%-*}__none__${n##*-}__$w.png"
            done
          }
          put before "$BASE"
          put after HEAD
          # in the image, as the runner installs no browser
          docker run --rm --init --ipc=host --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:$PWD" \
            --workdir "$PWD/apps/e2e" "$PLAYWRIGHT_IMAGE" \
            node scripts/pair-sheets.mts "$PWD/sheet/before" "$PWD/sheet/after" "$PWD/sheet/out"
          echo "made=1" >> "$GITHUB_OUTPUT"
      - name: Keep the paired contact sheet for review
        if: steps.sheet.outputs.made == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drawing-contact-sheet
          path: sheet/out
      - name: Keep the drawing baseline results (actual and diff images) of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-checks-test-results
          path: apps/e2e/test-results
      - if: always()
        run: docker compose down --volumes

  # The Playwright specs of every project but `next-chromium` (NEXT_EDITION=off), which the `e2e-next` job runs, split
  # by Playwright's `--shard`. Three shards: the specs took 25 minutes on one runner, and `e2e-next` takes longer than
  # a third of that plus the setup of a shard.
  e2e-shard:
    name: e2e (shard ${{ matrix.shard }}/3)
    needs: changes
    # the plan of `e2e-checks`: a failed `changes` job still runs it
    if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
    runs-on: ubuntu-latest
    # at least 10 minutes above the slowest shard
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      API_URL: http://localhost:3000
      WEB_URL: http://localhost:3003
      PRERENDER: ${{ github.event_name == 'pull_request' && needs.changes.outputs.prerender == 'sample' && 'sample' || 'full' }}
      NEXT_PUBLIC_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      - name: Pull the Playwright image of the locked @playwright/test
        uses: ./.github/actions/playwright-image
        with:
          package: apps/e2e/node_modules/@playwright/test/package.json
      - run: pnpm --filter "@rangefoundry/web^..." run build
      - run: docker compose up --detach --build api
      - name: Wait for the API
        run: |
          for _ in $(seq 1 60); do
            curl --silent --fail http://localhost:3000/ && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Key of the Turbopack cache
        id: next
        run: |
          next=$(node -p "require('./apps/web/package.json').dependencies.next")
          echo "prefix=next-export-$RUNNER_OS-$RUNNER_ARCH-$next" >> "$GITHUB_OUTPUT"
      - name: Restore the Turbopack cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache/turbopack
          key: ${{ steps.next.outputs.prefix }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'apps/web/next.config.ts') }}-${{ hashFiles('apps/web/src/**', 'packages/*/src/**') }}
          restore-keys: |
            ${{ steps.next.outputs.prefix }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'apps/web/next.config.ts') }}-
      - name: Export the static site
        run: |
          if [ "$PRERENDER" = sample ]; then
            pnpm --filter @rangefoundry/tools run pages --sample
          else
            pnpm --filter @rangefoundry/tools run pages --no-docs
          fi
      - name: Serve the export
        run: |
          node tools/src/pages-serve.ts &
          for _ in $(seq 1 30); do curl --silent --fail http://localhost:3003/ > /dev/null && exit 0; sleep 1; done
          exit 1
      # `pnpm run test:e2e` as scripts/baseline.sh runs it: as the runner's user, so the results stay writable for the
      # upload of a failed run
      - name: End-to-end tests in the Playwright image
        run: |
          docker run --rm --init --ipc=host --network=host --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --env CI --env GITHUB_ACTIONS --env API_URL --env WEB_URL --env NEXT_PUBLIC_REPOSITORY_URL \
            --env NEXT_EDITION=off --volume "$PWD:$PWD" --workdir "$PWD/apps/e2e" \
            "$PLAYWRIGHT_IMAGE" npx playwright test --shard="$SHARD"
      - name: Keep the e2e results (actual and diff images) of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results-${{ matrix.shard }}
          path: apps/e2e/test-results
      - if: always()
        run: docker compose down --volumes

  # The required check `e2e`: it fails unless `e2e-checks` and every shard succeeded, and is skipped with them when
  # the plan skips the e2e suite.
  e2e:
    needs: [changes, e2e-checks, e2e-shard]
    if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Results of the e2e jobs
        env:
          CHECKS: ${{ needs.e2e-checks.result }}
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e-checks: $CHECKS, e2e-shard: $SHARDS"
          [ "$CHECKS" = success ] && [ "$SHARDS" = success ]

  # The web specs of the routes the Start app has ported, on its next edition (project `next-chromium`), apart from
  # `e2e` so that job keeps its timeout headroom. Playwright's `webServer` builds and serves the Start site; no API.
  e2e-next:
    needs: changes
    # the plan of `e2e`: a failed `changes` job still runs it
    if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # as in `e2e`: the Start build reads it, and the specs see the shell's repository links
      NEXT_PUBLIC_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      - name: Pull the Playwright image of the locked @playwright/test
        uses: ./.github/actions/playwright-image
        with:
          package: apps/e2e/node_modules/@playwright/test/package.json
      - run: pnpm --filter "@rangefoundry/web^..." run build
      - name: Next edition tests in the Playwright image
        run: |
          docker run --rm --init --ipc=host --network=host --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --env CI --env GITHUB_ACTIONS --env NEXT_PUBLIC_REPOSITORY_URL \
            --volume "$PWD:$PWD" --workdir "$PWD/apps/e2e" \
            "$PLAYWRIGHT_IMAGE" npx playwright test --project next-chromium
      - name: Keep the e2e results of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-next-test-results
          path: apps/e2e/test-results
