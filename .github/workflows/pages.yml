name: Pages

# Builds the Pages edition (`npm run pages:build`, README) from main and deploys it to GitHub Pages,
# with the build of develop under `develop/` as a preview (`PAGES_PREVIEW`). The two refs build in
# jobs of their own, so no code of develop runs next to the released site's files. The repository's
# Pages source must be "GitHub Actions" and the `github-pages` environment must accept main and develop.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'OpenReloading/Ballistics'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts && node patches/apply.mjs
      - run: npm run build
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm run pages:build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_URL: ${{ steps.pages.outputs.origin }}
          NEXT_PUBLIC_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          # the docs navbar's repository widget reads stars, forks and the release at build time
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: pages
          if-no-files-found: error
          retention-days: 1

  # the preview of develop, a site of its own under `<base path>/develop`: a failure leaves the
  # released site to deploy without it (`assemble`)
  preview:
    if: github.repository == 'OpenReloading/Ballistics'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts && node patches/apply.mjs
      - run: npm run build
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm run pages:build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/develop
          PAGES_URL: ${{ steps.pages.outputs.origin }}
          PAGES_PREVIEW: '1'
          NEXT_PUBLIC_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview
          path: pages
          if-no-files-found: error
          retention-days: 1

  # the released site with the preview as `develop/`: a failed `build` fails the run and the
  # earlier deployment stays, a failed `preview` leaves a warning annotation
  assemble:
    needs: [build, preview]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      # a preview job that failed has no artifact: the download fails and is only a warning
      - id: preview
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview
          path: site/develop
      - if: steps.preview.outcome != 'success'
        run: echo "::warning title=Preview of develop::The preview was not built, the released site deploys without it."
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
