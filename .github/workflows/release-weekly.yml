name: Release weekly
on:
  schedule:
    - cron: "0 14 * * 1" # Monday 14:00
      timezone: Europe/Berlin
  workflow_dispatch:
permissions: {}
jobs:
  weekly:
    permissions:
      contents: read
      pull-requests: write
      actions: write
    uses: eikelandin/repo-standards/.github/workflows/release-weekly.yml@3da785e9f3d7890ef72234e5ef84bb7df0827e18
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
