name: Release

# release-please keeps one release pull request open from the Conventional Commits on main; merging it
# tags each changed component <component>-vX.Y.Z, writes its CHANGELOG.md and GitHub Release, the
# images job publishes the api and web images of the components released (with an SBOM attestation each),
# the sbom-release job attaches those SBOMs to the GitHub Releases, and the publish job pushes the
# libraries to npm (trusted publishing, no token).
# Steps and versioning: apps/docs/docs/release.md.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.repository == 'OpenReloading/Ballistics'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      images: ${{ steps.images.outputs.matrix }}
      libraries: ${{ steps.libraries.outputs.names }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # GITHUB_TOKEN, so GitHub signs the release commits (main requires signed commits; a personal token's
          # API commits are unsigned)
          # the release pull request targets main; the default is the repository's default branch, develop
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The release PR's CI runs wait for a maintainer's approval, because github-actions opened the PR. Auto-merge
      # squashes it once its required checks pass. Enabled with RELEASE_PLEASE_TOKEN (fine-grained token, this
      # repository only, Contents and Pull requests read and write), so the push of that merge starts this workflow
      # again, which tags the release and builds the images; a merge by GITHUB_TOKEN would start no workflow.
      # Every run, not only when the PR changed: an unchanged release PR may still lack auto-merge.
      - if: steps.release.outcome == 'success'
        continue-on-error: true   # never blocks the release or the images
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PR: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number || '' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::RELEASE_PLEASE_TOKEN not set: merge the release pull request by hand"; exit 0; fi
          prs=$PR
          # the action's pr output can be empty after an update; the label search lags a few seconds behind the PR
          for _ in $(seq 6); do
            [ -n "$prs" ] && break
            sleep 5
            prs=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --label 'autorelease: pending' --json number --jq '.[].number')
          done
          for pr in $prs; do
            gh pr merge "$pr" --auto --squash -R "$GITHUB_REPOSITORY"
          done
      # per-path outputs exist only for the components released in this run
      - id: images
        env:
          API_VERSION: ${{ steps.release.outputs['packages/api--version'] }}
          API_TAG: ${{ steps.release.outputs['packages/api--tag_name'] }}
          WEB_VERSION: ${{ steps.release.outputs['apps/web--version'] }}
          WEB_TAG: ${{ steps.release.outputs['apps/web--tag_name'] }}
        run: |
          matrix=$(jq -nc \
            --arg av "$API_VERSION" --arg at "$API_TAG" --arg wv "$WEB_VERSION" --arg wt "$WEB_TAG" \
            '[{name: "api", dockerfile: "packages/api/Dockerfile", version: $av, tag: $at,
               licenses: "MIT AND CC-BY-4.0 AND Apache-2.0"},
              {name: "web", dockerfile: "apps/web/Dockerfile", version: $wv, tag: $wt,
               licenses: "MIT AND CC-BY-4.0 AND Apache-2.0 AND BSD-3-Clause AND OFL-1.1"}]
             | map(select(.version != ""))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - id: libraries
        env:
          SCHEMA: ${{ steps.release.outputs['packages/schema--release_created'] }}
          CORE: ${{ steps.release.outputs['packages/core--release_created'] }}
          DRAWING: ${{ steps.release.outputs['packages/drawing--release_created'] }}
          IMPORTERS: ${{ steps.release.outputs['packages/importers--release_created'] }}
          DATA: ${{ steps.release.outputs['packages/data--release_created'] }}
        run: |
          names=$(jq -nc \
            --arg schema "$SCHEMA" --arg core "$CORE" --arg drawing "$DRAWING" \
            --arg importers "$IMPORTERS" --arg data "$DATA" \
            '[["schema", $schema], ["core", $core], ["drawing", $drawing], ["importers", $importers], ["data", $data]]
             | map(select(.[1] == "true") | .[0])')
          echo "names=$names" >> "$GITHUB_OUTPUT"

  # The images are built in the run that made the release; no workflow triggers on releases or tags.
  images:
    needs: release-please
    if: needs.release-please.outputs.images != '[]' && needs.release-please.outputs.images != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
      security-events: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.release-please.outputs.images) }}
    env:
      IMAGE: ghcr.io/openreloading/ballistics-${{ matrix.name }}
      # Dependabot does not read this reference: bump it by hand
      SYFT_IMAGE: docker.io/anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a
      SBOM_FILE: ballistics-${{ matrix.name }}-${{ matrix.version }}.spdx.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.tag }}
          persist-credentials: false
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ matrix.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ matrix.version }}
            type=sha
          labels: |
            org.opencontainers.image.title=OpenReloading Ballistics ${{ matrix.name }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}
      # built into the local image store first, so a failed scan publishes nothing
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          severity-cutoff: critical
          only-fixed: true
          output-format: sarif
      - if: ${{ !cancelled() && steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: image-${{ matrix.name }}
      # SPDX SBOM of the image that is pushed, read from the saved image: the syft container gets no registry
      # credentials (the login comes after)
      - env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir "$RUNNER_TEMP/sbom"
          docker save "$IMAGE:$VERSION" -o "$RUNNER_TEMP/sbom/image.tar"
          docker run --rm -v "$RUNNER_TEMP/sbom:/work" "$SYFT_IMAGE" docker-archive:/work/image.tar \
            --source-name "$IMAGE" --source-version "$VERSION" -o "spdx-json=/work/$SBOM_FILE"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        run: |
          docker push --all-tags "$IMAGE"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.meta.outputs.version }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom/${{ env.SBOM_FILE }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }}
          path: ${{ runner.temp }}/sbom/${{ env.SBOM_FILE }}
          if-no-files-found: error
          retention-days: 1

  # Own job, so that only this one holds contents: write and no step that builds or runs image code does.
  sbom-release:
    needs: [release-please, images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      IMAGES: ${{ needs.release-please.outputs.images }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          merge-multiple: true
          path: sbom
      # --clobber: a re-run replaces the asset
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -r '.[] | [.tag, .name, .version] | @tsv' <<< "$IMAGES" | while IFS=$'\t' read -r tag name version; do
            gh release upload "$tag" "sbom/ballistics-$name-$version.spdx.json" --clobber -R "$GITHUB_REPOSITORY"
          done

  # npm trusted publishing (OIDC): no npm token. Each library needs a Trusted Publisher on npmjs.com for this
  # repository and workflow. The pushed commit is the release commit, the one every tag points at.
  publish:
    needs: release-please
    if: needs.release-please.outputs.libraries != '[]' && needs.release-please.outputs.libraries != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      LIBRARIES: ${{ needs.release-please.outputs.libraries }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # trusted publishing needs npm 11.5.1 or later (Node 22.14.0 or later)
      - run: '[ "$(printf ''%s\n11.5.1'' "$(npm --version)" | sort -V | head -n 1)" = 11.5.1 ]'
      # no lifecycle scripts: this job holds the OIDC publish token, and the libraries do not need the Mantine patch
      - run: npm ci --ignore-scripts
      - run: npm run build -w @open-reloading/schema -w @open-reloading/core -w @open-reloading/drawing -w @open-reloading/importers -w @open-reloading/data
      # in the order of LIBRARIES; a version that is already on the registry is skipped, so a failed run can be re-run
      - run: |
          for name in $(jq -r '.[]' <<< "$LIBRARIES"); do
            package="@open-reloading/$name"
            version=$(node -p "require('./packages/$name/package.json').version")
            if npm view "$package@$version" version > /dev/null 2>&1; then
              echo "$package@$version is already published"
              continue
            fi
            npm publish -w "$package" --provenance
          done
