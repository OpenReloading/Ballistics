version = 1

# Everything else: the repository's code, tests, test fixtures, scripts and generated files (LICENSE).
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 the RangeFoundry contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

# Documentation: the docs site pages, their examples and the Markdown files.
[[annotations]]
path = ["apps/docs/docs/**", "apps/docs/examples/**", "**/*.md", "**/*.mdx"]
SPDX-FileCopyrightText = "2026 the RangeFoundry contributors"
SPDX-License-Identifier = "MIT"

# API reports generated from the code's declarations, and a test fixture.
[[annotations]]
path = ["**/*.api.md", "tools/test/fixtures/markdown-meaning.md"]
SPDX-FileCopyrightText = "2026 the RangeFoundry contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

# The design tokens, which other projects use (packages/design-tokens/LICENSE).
[[annotations]]
path = "packages/design-tokens/**"
SPDX-FileCopyrightText = "2026 the RangeFoundry contributors"
SPDX-License-Identifier = "MIT"

# Docs repository widget: own code plus GitHub Octicons icon paths (https://github.com/primer/octicons, MIT).
[[annotations]]
path = "apps/docs/src/components/RepoWidget.tsx"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 the RangeFoundry contributors", "2026 GitHub Inc."]
SPDX-License-Identifier = "AGPL-3.0-only AND MIT"

# Catalog records (NOTICE, packages/catalog/LICENSE).
[[annotations]]
path = "packages/catalog/records/**"
SPDX-FileCopyrightText = "2026 the RangeFoundry contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Facts makers and other publishers print (packages/catalog/LICENSE).
[[annotations]]
path = [
  "packages/catalog/records/bullets/*.json",
  "packages/catalog/records/powders/*.json",
  "packages/catalog/records/capacities/6-5-prc-shooting-times.json",
  "packages/catalog/records/capacities/6-8-western-shooting-times.json",
  "packages/catalog/records/capacities/7-mm-precision-rifle-cartridge-hodgdon.json",
]
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "LicenseRef-Published-Facts AND CC-BY-SA-4.0"

# The demo records are the project's own.
[[annotations]]
path = ["packages/catalog/records/bullets/demo-*.json", "packages/catalog/records/powders/demo-*.json"]
SPDX-FileCopyrightText = "2026 the RangeFoundry contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Records derived from Wikipedia: the Wikipedia contributors hold rights in them too.
[[annotations]]
path = "packages/catalog/records/capacities/*-wikipedia.json"
SPDX-FileCopyrightText = "2026 the RangeFoundry contributors, Wikipedia contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Names and logos: no open license (LICENSES/LicenseRef-Brand.txt, NOTICE).
[[annotations]]
path = [
  "apps/web/src/assets/ballistics-light.svg",
  "apps/web/src/assets/ballistics-dark.svg",
  "apps/web/public/opengraph-image.png",
  "apps/web/src/assets/icon.png",
  "apps/web/src/assets/apple-icon.png",
  "apps/web/public/icon-192.png",
]
SPDX-FileCopyrightText = "2026 the RangeFoundry contributors"
SPDX-License-Identifier = "LicenseRef-Brand"

# Hole detection model weights, trained in part on third-party target photos (NOTICE, apps/docs/docs/models/hole-detection.md, Model file).
[[annotations]]
path = "apps/web/public/models/hole-model-*.onnx"
SPDX-FileCopyrightText = "2026 the RangeFoundry contributors, the authors of the third-party training photos"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Inter fonts and their license text (apps/web/src/platform/fonts/OFL.txt).
[[annotations]]
path = [
  "apps/web/src/platform/fonts/Inter-Regular.woff2",
  "apps/web/src/platform/fonts/Inter-SemiBold.woff2",
  "apps/web/src/platform/fonts/OFL.txt",
]
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

# Agent skill with its own license file (.claude/skills/mantine-form/LICENSE).
[[annotations]]
path = ".claude/skills/mantine-form/**"
SPDX-FileCopyrightText = "2026 Mantine"
SPDX-License-Identifier = "MIT"
