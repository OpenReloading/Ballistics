version = 1

# Everything else: the repository's code, documentation and test fixtures (LICENSE).
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 OpenReloading contributors"
SPDX-License-Identifier = "MIT"

# Catalog records (NOTICE, packages/catalog/LICENSE).
[[annotations]]
path = "packages/catalog/records/**"
SPDX-FileCopyrightText = "2026 OpenReloading contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Records derived from Wikipedia state CC-BY-SA-4.0 in their source (packages/catalog/LICENSE).
[[annotations]]
path = "packages/catalog/records/capacities/*-wikipedia.json"
SPDX-FileCopyrightText = "2026 OpenReloading contributors, Wikipedia contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Logo files copied from the OpenReloading Artwork repository (NOTICE).
[[annotations]]
path = [
  "apps/web/src/assets/ballistics-light.svg",
  "apps/web/src/assets/ballistics-dark.svg",
  "apps/web/public/opengraph-image.png",
  "apps/web/src/app/icon.png",
  "apps/web/src/app/apple-icon.png",
  "apps/web/public/icon-192.png",
]
SPDX-FileCopyrightText = "2026 OpenReloading contributors"
SPDX-License-Identifier = "MIT"

# Inter fonts and their license text (apps/web/src/platform/fonts/OFL.txt).
[[annotations]]
path = [
  "apps/web/src/platform/fonts/Inter-Regular.woff2",
  "apps/web/src/platform/fonts/Inter-SemiBold.woff2",
  "apps/web/src/platform/fonts/OFL.txt",
]
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

# Agent skill with its own license file (.claude/skills/mantine-form/LICENSE).
[[annotations]]
path = ".claude/skills/mantine-form/**"
SPDX-FileCopyrightText = "2026 Mantine"
SPDX-License-Identifier = "MIT"
