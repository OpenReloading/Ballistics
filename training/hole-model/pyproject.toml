[project]
name = "hole-model"
version = "0.1.0"
description = "Trains the hole center heatmap net from scratch, exports it to ONNX and scores it."
license = "ISC"
requires-python = "==3.13.*"
dependencies = [
  "numpy==2.5.5",
  "onnx==1.23.2",
  # the onnxruntime-web version of the model manifest, so the parity check runs on the app's runtime
  "onnxruntime==1.31.1",
  "pillow==13.0.0",
  "torch==2.15.0",
]

[project.scripts]
hole-model = "hole_model.cli:main"
license-check = "hole_model.license_check:main"

[dependency-groups]
dev = ["mypy==2.4.1", "pytest==9.2.0", "ruff==0.17.6"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["onnxruntime"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
