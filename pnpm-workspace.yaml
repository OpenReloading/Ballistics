packages:
  - packages/*
  - apps/*
  - tools
  - tooling/*

# A version must be 3 days old before an install resolves to it: the Dependabot cooldown, applied to transitive
# packages too.
minimumReleaseAge: 4320
strictPeerDependencies: true

# One version per dependency that two or more workspaces use: they name it as "catalog:". Dependabot updates it here.
# Exact versions, except zod: the published libraries depend on it, and `pnpm pack` writes the catalog's range.
catalog:
  "@arethetypeswrong/cli": 0.18.5
  # every @mantine package, so one upgrade moves them together
  "@mantine/core": 9.7.4
  "@mantine/form": 9.7.4
  "@mantine/hooks": 9.7.4
  "@mantine/spotlight": 9.7.4
  "@microsoft/api-extractor": 7.60.1
  "@playwright/test": 1.64.1
  "@types/node": 26.6.6
  "@vitest/browser": 5.0.5
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-v8": 5.0.5
  ajv: 8.20.0
  fast-check: 4.10.2
  oxlint: 1.90.0
  oxlint-tsgolint: 7.0.2005
  # the same version as @playwright/test: both run in PLAYWRIGHT_IMAGE (ci.yml)
  playwright: 1.64.1
  publint: 0.3.25
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 7.0.2
  vitest: 5.0.5
  yaml: 2.9.1
  zod: ^4.6.7

# Versions with the fix for a security advisory of a transitive dependency.
overrides:
  "@docusaurus/core>tinypool": ^2.1.2
  katex: 0.19.0
  postcss-selector-parser: ^7.1.6
  serialize-javascript: ^7.1.3
  sockjs>uuid: ^11.1.1

# No dependency runs an install script: CI installs with --ignore-scripts, and none of these needs one (native binaries
# come as optional dependencies).
allowBuilds:
  "@swc/core": false
  core-js: false
  esbuild: false
  vue-demi: false

# eslint-plugin-regexp runs inside Oxlint (jsPlugins), which needs no ESLint: its ESLint peer stays out.
packageExtensions:
  eslint-plugin-regexp:
    peerDependenciesMeta:
      eslint:
        optional: true
  "@eslint-community/eslint-utils":
    peerDependenciesMeta:
      eslint:
        optional: true
