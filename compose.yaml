services:
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      # node, because the slim image has no curl
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      retries: 30

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy

  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
      args:
        API_URL: http://localhost:${API_PORT:-3000}
        APP_URL: http://localhost:${WEB_PORT:-3001}
    ports:
      - "${DOCS_PORT:-3002}:8080"
