services:
  db:
    image: docker.io/library/postgres:18-bookworm
    environment:
      POSTGRES_USER: ballistics
      POSTGRES_PASSWORD: ballistics
      POSTGRES_DB: ballistics
    ports:
      # the credentials above are fixed: reachable from this machine only
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # TCP, so the init server of the image's entrypoint (socket only) does not count as ready
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "ballistics", "-d", "ballistics"]
      interval: 2s
      retries: 30

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    environment:
      DATABASE_URL: postgres://ballistics:ballistics@db:5432/ballistics
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # node, because the slim image has no curl
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      retries: 30
      # building the tables and seeding on a cold start; failed probes in this window do not count
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy

  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
      args:
        API_URL: http://localhost:${API_PORT:-3000}
        APP_URL: http://localhost:${WEB_PORT:-3001}
    ports:
      - "${DOCS_PORT:-3002}:80"

volumes:
  pgdata:
