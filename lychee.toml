# Link check of the tracked Markdown files, shared by the offline run in ci.yml (relative links and anchors only) and
# the scheduled online run in links.yml (external links too).
include_fragments = "anchor-only"
no_progress = true

# External links only (the offline run skips them). A browser agent, because some hosts refuse the default one.
user_agent = "Mozilla/5.0 (X11; Linux x86_64; rv:130.0) Gecko/20100101 Firefox/130.0"
timeout = 30
max_retries = 4
retry_wait_time = 15
host_concurrency = 2
host_request_interval = "500ms"
# a failure is never cached: it is checked again on the next run
cache_exclude_status = ["400.."]
max_cache_age = "6d"
# localhost addresses in the docs name local servers (dev server, export, API), not pages to check
exclude_loopback = true

# Pages that answer 403 or drop the connection for an automated client, one URL each, never a whole host. They are
# not broken links as far as can be told, only unreachable for a check. Recheck by hand when the page is edited.
exclude = [
  '^https://doi\.org/10\.1111/j\.1469-1809\.1936\.tb02137\.x$', # Wiley refuses automated clients
  '^https://doi\.org/10\.1103/RevModPhys\.93\.025010$', # the DOI resolver answers 403 to automated clients
  '^https://doi\.org/10\.1137/1\.9781611970319$', # SIAM answers 403 to automated clients
  '^https://www\.npmjs\.com/org/open-reloading$', # npmjs.com answers 403 to automated clients
  '^https://www\.accurateshooter\.com/\?p=2477$', # a bot filter answers 307 without a target to automated clients
  '^https://www\.knsa\.nl/$', # the server sends a certificate chain that does not verify (openssl: unable to verify the first certificate)
  '^https://www\.knsa\.nl/media/1956/swr-delen-i-x-samengevoegd\.pdf$', # same broken chain
  '^https://hdl\.handle\.net/11104/0129879$', # 404 to the CI runner on scheduled runs in a row, 302 to a 200 page elsewhere
  # Single-page apps that route by the fragment, which is not an anchor in the served HTML.
  '^https://chromedevtools\.github\.io/devtools-protocol/#/Emulation\.setCPUThrottlingRate$',
  '^https://tsdr\.uspto\.gov/#caseNumber=98007111&caseType=SERIAL_NO&searchType=statusSearch$',
  # The site root serves the docs of the latest release, and no release has them yet. Drop these at the first release.
  '^https://openreloading\.github\.io/Ballistics/docs/feedback-tasks/$',
  '^https://openreloading\.github\.io/Ballistics/docs/libraries/core/$',
  '^https://openreloading\.github\.io/Ballistics/docs/libraries/data/$',
  '^https://openreloading\.github\.io/Ballistics/docs/libraries/drawing/$',
  '^https://openreloading\.github\.io/Ballistics/docs/libraries/importers/$',
  '^https://openreloading\.github\.io/Ballistics/docs/libraries/schema/$',
]
