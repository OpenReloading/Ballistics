# Spell check of code, comments, docs and UI text (typos, run by ci.yml `check`).
# Locally: `typos` from https://github.com/crate-ci/typos, or `docker run`-free: any 1.51 binary on the PATH.
# The web app's English messages on their own, without the UK words that [type.ts] passes for the code names:
# `node apps/web/scripts/i18n.mts messages | typos -`.

[files]
ignore-hidden = false
extend-exclude = [
  ".git/",
  # records quote names, titles and units in the language of their source
  "packages/catalog/records/",
  # generated or copied byte for byte from a tool
  "pnpm-lock.yaml",
  # the API contract as last released, rewritten only for a breaking change
  "packages/api/openapi.baseline.json",
  # generated from the commit titles of released versions
  "**/CHANGELOG.md",
  ".github/pnpm/package-lock.json",
  "*.snap",
  "**/*-snapshots/",
  "**/test/golden/",
  # a catalogue is written in the language it translates into (german-terms.json is checked)
  "apps/web/src/i18n/??.json",
]

[default]
locale = "en-us"
# Each pattern is one German string or citation, so a misspelling elsewhere still fails.
extend-ignore-re = [
  # German month names of the ShotView export, a German CSV fixture line and a German stage label
  "januar februar m\\\\u00E4rz april mai juni juli august september oktober november dezember",
  "8\\. Februar 2026",
  "Alle Sch\\\\u00FCsse",
  "Sek\\. Serie",
  # the singular and plural forms of the German term for a series (german-terms.json, translating.md)
  "\\[\"Serie\", \"Serien\"\\]",
  # German organization name in the bibliography
  "Bund Deutscher",
  # a product page title as the maker prints it (it misspells the name) and a powder trade name, in the bibliography
  "Accuarte No\\. 5",
  "LEVERevolution",
  # Dutch names in the federations page and the bibliography
  "Precisie Geweer",
  "Schietsport Associatie",
  # German texts that the tests of the message mapping and the workbench warnings expect
  "Geben Sie eine Zahl für .* ein\\.",
  "Geben Sie eine Zielgröße über 0 ein\\.",
  "muss positiv sein",
  "größer als 0 sein",
  "unter dem 2,2-Fachen",
  "Das obere Ende des simulierten Gasdruckbereichs",
  "klein für das Modell",
  "für den das Modell gebaut wurde",
  "0,6[0-9]; das Modell liegt",
  # German field label of the no-valid-run refusal that the charge-target test expects
  "Feld: (Zünddruck|heat)\\.",
  # German labels that the test of the printed pages expects
  "Höhenverstellung \\(MOA / Klicks\\)",
  "Kein Maßstab: Das Foto hat keine Referenz\\.",
  # German refusal of a file in another format that the user data test expects
  "Die Datei ist keine OpenReloading-Datendatei\\.",
  # German count of the problems a refused file does not list, that the user data test expects
  "und 2 weitere Probleme",
  # German repeated-id warning and unit warning that the import diagnostics test expects
  "Ändern Sie Name, Hersteller, Durchmesser oder Masse der Zeile 3, um sie als eigenen Datensatz zu importieren\\.",
  "Prüfen Sie die Einheit der Spalte\\.",
  # German umlaut folded to its transliteration by the table import
  "replaceAll\\('ü', 'ue'\\)",
  # titles of cited papers as their authors spelled them
  "the centre circle constraint",
  "Interior ballistics modelling of a rifled barrel",
  # column aliases the table import accepts, listed in the table import page
  "caliber, calibre, cal, kaliber",
  # a message placeholder and CSS classes that keep their UK spelling
  "\\{colours?\\}|burn-neighbours|face-colours|workbench-centre|colour-row|ov-centre",
]

# Code names keep their UK spelling (record fields, enum values, the public API, the CLI and API output). In TypeScript
# the names with a UK stem are skipped, and the bare words below are allowed in comments and messages too.
[type.ts]
extend-ignore-re = [
  # camelCase and PascalCase names with a UK stem, such as centreX, faceColour and MarkNormalisation
  "\\b\\w*[a-z0-9](Centre|Colour|Neighbour|Normalis|Labell|Unlabell|Metre|Vapour|Calibre|Modell|Licence|Aluminium)\\w*",
  "\\b(centre|colour|colours|labelled|normalise|neighbours|vapour|capitalised|metres|modelled)[A-Z0-9_]\\w*",
]

[type.ts.extend-identifiers]
Aluminium = "Aluminium"
aluminium = "aluminium"
analyse = "analyse"
calibre = "calibre"
calibres = "calibres"
capitalised = "capitalised"
centre = "centre"
centred = "centred"
centres = "centres"
colour = "colour"
coloured = "coloured"
colours = "colours"
humanised = "humanised"
Labeller = "Labeller"
labelled = "labelled"
LICENCE = "LICENCE"
licence = "licence"
metres = "metres"
millimetres = "millimetres"
modelled = "modelled"
Neighbour = "Neighbour"
Neighbours = "Neighbours"
neighbours = "neighbours"
Normalisation = "Normalisation"
normalised = "normalised"
recognise = "recognise"

# Code in Markdown names fields and values of the records and the code, which keep their spelling.
[type.md]
extend-ignore-re = [
  "(?s)```.*?```",
  "`[^`\\n]*`",
]

[default.extend-words]
# English verb of gyrodynamics (the spin axis precesses)
precess = "precess"
# axe-core, the accessibility checker of the tests
axe = "axe"
# symbols of the equations in packages/ballistics: transverse moment of inertia, burn rate factor
iy = "iy"
ba = "ba"

# File names that keep their UK spelling: a published docs page and the script ci.yml runs.
[type.uk-file-names]
extend-glob = ["licences.ts", "licences.test.ts", "hole-detection-target-centre.md"]
check-filename = false
